name: CBTI
options:
  bundleIdPrefix: com.montysharma
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  CBTI:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "CBT-I"
        LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        NSHealthShareUsageDescription: "CBT-I reads sleep data from Apple Health to pre-fill your morning sleep log."
        NSHealthUpdateUsageDescription: "CBT-I does not write data to Apple Health. This entry is required because the HealthKit framework is linked."
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.montysharma.cbti.oauth
            CFBundleURLSchemes: [cbti]
    entitlements:
      path: CBTI.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.montysharma.cbti
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.montysharma.cbti
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.montysharma.cbti
        PRODUCT_NAME: "CBT-I"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "9C4LVC9DR6"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SDKROOT: auto
        # CloudKit container is referenced from the entitlements file
        # and auto-created in Xcode on first build with iCloud capability enabled.
